<!DOCTYPE html>
<html lang="uz-Cyrl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020617">
<title>Исломий Тақвим</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=DM+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main>
  <div id="view-home"></div>
  <div id="view-day" class="hidden"></div>
  <div id="view-calendar" class="hidden"></div>
</main>

<nav class="bottom-nav" aria-label="Асосий навигация">
  <button class="bottom-nav-btn active" id="nav-home" onclick="showHome()">
    <span class="bottom-nav-icon" aria-hidden="true">◇</span>
    <span class="bottom-nav-label">Кунлар</span>
  </button>
  <button class="bottom-nav-btn" id="nav-cal" onclick="showCalendar()">
    <span class="bottom-nav-icon" aria-hidden="true">▦</span>
    <span class="bottom-nav-label">Тақвим</span>
  </button>
</nav>

<script src="data.js"></script>
<script src="hijri.js"></script>
<script src="vaqtlar/prayer.js"></script>
<script src="app.js"></script>

<script>
// PWA / Service Worker регистрацияси + янги версия banner.
// SW кейинги версияни топса, фойдаланувчига кичкина banner кўрсатилади.
// Banner босилса skipWaiting() ишга тушади ва саҳифа янгиланади.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          // Фақат олдинги SW бор бўлса янги версия деб қойилади (1-юкланиш эмас).
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            showUpdateBanner(nw);
          }
        });
      });
    }).catch(function () {});

    // Янги SW тахт олганда — саҳифани автомат янгилаймиз.
    var refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  });
}

function showUpdateBanner(worker) {
  if (document.querySelector('.update-banner')) return;
  var b = document.createElement('div');
  b.className = 'update-banner';
  var s = document.createElement('span');
  s.textContent = 'Янги версия мавжуд';
  var btn = document.createElement('button');
  btn.textContent = 'Янгилаш';
  btn.addEventListener('click', function () { worker.postMessage('SKIP_WAITING'); });
  b.appendChild(s);
  b.appendChild(btn);
  document.body.appendChild(b);
}
</script>

</body>
</html>
