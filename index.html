<!DOCTYPE html>
<html lang="uz-Cyrl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Исломий Тақвим</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Manrope:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    /* Денгиз ранг палитраси */
    --sea-50: #f0f9ff;
    --sea-100: #e0f2fe;
    --sea-200: #bae6fd;
    --sea-300: #7dd3fc;
    --sea-400: #38bdf8;
    --sea-500: #0ea5e9;
    --sea-600: #0284c7;
    --sea-700: #0369a1;
    --sea-800: #075985;
    --sea-900: #0c4a6e;
    --sea-950: #082f49;

    /* Деnгиз чуқурлиги градиенти */
    --deep-1: #0c4a6e;
    --deep-2: #075985;
    --deep-3: #0369a1;

    /* Акцентлар */
    --coral: #fb7185;
    --gold: #fbbf24;
    --teal: #14b8a6;
    --purple: #a78bfa;
    --emerald: #10b981;

    --ink: #0f172a;
    --ink-soft: #475569;
    --ink-light: #94a3b8;
    --line: #e2e8f0;
    --bg: #f8fafc;
    --white: #ffffff;
  }

  body {
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .display { font-family: 'Playfair Display', Georgia, serif; }
  .arabic { font-family: 'Amiri', serif; }

  /* === HEADER === */
  header {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    background: none;
    border: none;
    cursor: pointer;
  }
  .brand-mark {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--sea-500) 0%, var(--sea-700) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 22px;
    box-shadow: 0 8px 20px -8px var(--sea-500);
    position: relative;
    overflow: hidden;
  }
  .brand-mark::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.3), transparent);
  }
  .brand-text { text-align: left; }
  .brand-name {
    font-family: 'Playfair Display', serif;
    font-size: 19px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.2;
  }
  .brand-tag {
    font-size: 11px;
    color: var(--ink-light);
    font-weight: 500;
    letter-spacing: 0.3px;
  }
  nav { display: flex; gap: 4px; background: var(--sea-50); padding: 4px; border-radius: 12px; }
  .nav-btn {
    padding: 8px 16px;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: var(--ink-soft);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .nav-btn.active {
    background: white;
    color: var(--sea-700);
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
  }

  /* === МАЙН === */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  /* === БОШ САҲИФА HERO === */
  .hero {
    background: linear-gradient(135deg, var(--deep-1) 0%, var(--deep-2) 50%, var(--sea-600) 100%);
    border-radius: 28px;
    padding: 36px 28px;
    color: white;
    position: relative;
    overflow: hidden;
    margin-bottom: 28px;
    box-shadow: 0 20px 60px -20px rgba(7, 89, 133, 0.4);
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 70%;
    height: 200%;
    background: radial-gradient(circle, rgba(125, 211, 252, 0.25) 0%, transparent 60%);
    pointer-events: none;
  }
  .hero::after {
    content: '';
    position: absolute;
    bottom: -30%;
    left: -10%;
    width: 50%;
    height: 100%;
    background: radial-gradient(circle, rgba(251, 191, 36, 0.15) 0%, transparent 60%);
    pointer-events: none;
  }
  /* Юлдузлар */
  .hero-stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.6;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 3s infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
  }
  .hero-content { position: relative; z-index: 1; }
  .hero-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 24px;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .live-dot {
    width: 8px;
    height: 8px;
    background: var(--sea-300);
    border-radius: 50%;
    box-shadow: 0 0 0 4px rgba(125, 211, 252, 0.3);
    animation: pulse-ring 2s infinite;
  }
  @keyframes pulse-ring {
    0%, 100% { box-shadow: 0 0 0 4px rgba(125, 211, 252, 0.3); }
    50% { box-shadow: 0 0 0 8px rgba(125, 211, 252, 0.1); }
  }
  .hero-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
    align-items: end;
  }
  @media (min-width: 720px) {
    .hero { padding: 48px 44px; }
    .hero-grid { grid-template-columns: 1.3fr 1fr; gap: 40px; }
  }
  .hijri-main {
    display: flex;
    flex-direction: column;
  }
  .hijri-day {
    font-family: 'Playfair Display', serif;
    font-size: 80px;
    font-weight: 800;
    line-height: 0.9;
    letter-spacing: -0.03em;
    background: linear-gradient(180deg, #ffffff 0%, var(--sea-200) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  @media (min-width: 720px) {
    .hijri-day { font-size: 110px; }
  }
  .hijri-month {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 600;
    margin-top: 4px;
    margin-bottom: 8px;
  }
  @media (min-width: 720px) {
    .hijri-month { font-size: 36px; }
  }
  .hijri-year {
    font-size: 14px;
    color: var(--sea-200);
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .gregorian-box {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 20px 24px;
  }
  .gregorian-label {
    font-size: 11px;
    color: var(--sea-200);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 8px;
  }
  .gregorian-date {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 600;
    line-height: 1.2;
    margin-bottom: 4px;
  }
  .gregorian-week {
    font-size: 14px;
    opacity: 0.85;
    font-weight: 500;
  }

  /* === ЯҚИНЛАШАЁТГАН КУН === */
  .upcoming {
    margin-bottom: 32px;
  }
  .upcoming-card {
    background: white;
    border-radius: 24px;
    padding: 24px;
    border: 1px solid var(--line);
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    align-items: center;
  }
  @media (min-width: 640px) {
    .upcoming-card {
      grid-template-columns: auto 1fr auto;
      padding: 28px 32px;
      gap: 28px;
    }
  }
  .upcoming-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 20px 40px -20px rgba(15, 23, 42, 0.15);
    border-color: var(--sea-200);
  }
  .upcoming-visual {
    width: 80px;
    height: 80px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    font-weight: 700;
    position: relative;
    overflow: hidden;
  }
  .upcoming-visual::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.25), transparent);
  }
  .upcoming-info { min-width: 0; }
  .upcoming-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 6px;
    margin-bottom: 8px;
  }
  .upcoming-name {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 4px;
    line-height: 1.2;
  }
  @media (min-width: 640px) {
    .upcoming-name { font-size: 28px; }
  }
  .upcoming-short {
    font-size: 14px;
    color: var(--ink-soft);
  }
  .upcoming-countdown {
    text-align: center;
    padding: 16px 20px;
    background: linear-gradient(135deg, var(--sea-50), var(--sea-100));
    border-radius: 16px;
    border: 1px solid var(--sea-200);
  }
  @media (max-width: 640px) {
    .upcoming-countdown {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
  }
  .countdown-number {
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    font-weight: 800;
    color: var(--sea-700);
    line-height: 1;
  }
  .countdown-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--sea-600);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
  }
  @media (max-width: 640px) {
    .countdown-label { margin-top: 0; }
  }

  /* === БЎЛИМ САРЛАВҲАСИ === */
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 16px;
  }
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.02em;
  }
  @media (min-width: 640px) {
    .section-title { font-size: 32px; }
  }
  .section-meta {
    font-size: 13px;
    color: var(--ink-light);
    font-weight: 500;
  }

  /* === КАРТОЧКАЛАР === */
  .cards-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  @media (min-width: 600px) {
    .cards-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 960px) {
    .cards-grid { grid-template-columns: repeat(3, 1fr); }
  }

  .day-card {
    background: white;
    border-radius: 20px;
    padding: 0;
    border: 1px solid var(--line);
    cursor: pointer;
    transition: all 0.3s;
    text-align: left;
    width: 100%;
    font-family: inherit;
    overflow: hidden;
    position: relative;
  }
  .day-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 40px -20px rgba(15, 23, 42, 0.15);
  }
  .day-card-banner {
    height: 80px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    padding: 0 20px;
  }
  .day-card-banner::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent 60%);
  }
  .day-card-number {
    font-family: 'Playfair Display', serif;
    font-size: 52px;
    font-weight: 800;
    color: white;
    line-height: 1;
    text-shadow: 0 4px 20px rgba(0,0,0,0.15);
    position: relative;
    z-index: 1;
  }
  .day-card-month-pill {
    margin-left: auto;
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(10px);
    color: white;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    position: relative;
    z-index: 1;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .day-card-body { padding: 18px 20px 20px; }
  .day-card-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 3px 8px;
    border-radius: 5px;
    margin-bottom: 10px;
  }
  .tag-bayram { background: #fef3c7; color: #92400e; }
  .tag-muhim { background: var(--sea-100); color: var(--sea-700); }
  .day-card-name {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 6px;
    line-height: 1.25;
  }
  .day-card-short {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin-bottom: 16px;
  }
  .day-card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 12px;
  }
  .day-card-greg {
    color: var(--ink-light);
    font-weight: 500;
  }
  .day-card-countdown {
    color: var(--sea-700);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .day-card-countdown.past { color: var(--ink-light); }
  .day-card-countdown.today { color: var(--coral); }

  /* === БАТАФСИЛ КУН === */
  .detail-wrap {
    max-width: 800px;
    margin: 0 auto;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: white;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 24px;
    font-family: inherit;
    transition: all 0.2s;
  }
  .back-btn:hover {
    border-color: var(--sea-300);
    color: var(--sea-700);
  }

  .detail-hero {
    border-radius: 28px;
    padding: 40px 28px;
    color: white;
    position: relative;
    overflow: hidden;
    margin-bottom: 24px;
  }
  @media (min-width: 640px) {
    .detail-hero { padding: 56px 48px; }
  }
  .detail-hero::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 70%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
  }
  .detail-content { position: relative; z-index: 1; }
  .detail-cat {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.25);
  }
  .detail-name {
    font-family: 'Playfair Display', serif;
    font-size: 40px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.02em;
    margin-bottom: 28px;
  }
  @media (min-width: 640px) {
    .detail-name { font-size: 56px; }
  }
  .detail-dates {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  @media (min-width: 480px) {
    .detail-dates { grid-template-columns: 1fr 1fr; gap: 24px; }
  }
  .detail-date-block {
    padding: 16px 20px;
    background: rgba(255,255,255,0.12);
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(10px);
  }
  .detail-date-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    opacity: 0.8;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .detail-date-value {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 600;
  }

  .detail-block {
    background: white;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 20px;
  }
  .detail-block-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--sea-600);
    margin-bottom: 12px;
  }
  .detail-text {
    font-size: 17px;
    line-height: 1.7;
    color: var(--ink);
  }

  .placeholder {
    border-radius: 20px;
    padding: 36px 24px;
    text-align: center;
    border: 1px dashed;
  }
  .placeholder.verses {
    background: linear-gradient(135deg, #fffbeb, #fef3c7);
    border-color: #fbbf24;
  }
  .placeholder.hadiths {
    background: linear-gradient(135deg, #ecfdf5, #d1fae5);
    border-color: #10b981;
  }
  .placeholder-icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
  }
  .placeholder.verses .placeholder-icon {
    background: #fbbf24;
    color: white;
  }
  .placeholder.hadiths .placeholder-icon {
    background: #10b981;
    color: white;
  }
  .placeholder-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .placeholder.verses .placeholder-title { color: #b45309; }
  .placeholder.hadiths .placeholder-title { color: #047857; }
  .placeholder-text {
    font-size: 14px;
  }
  .placeholder.verses .placeholder-text { color: #d97706; }
  .placeholder.hadiths .placeholder-text { color: #059669; }

  /* === ҲИЖРИЙ ТАҚВИМ === */
  .cal-shell {
    background: white;
    border-radius: 28px;
    padding: 24px;
    border: 1px solid var(--line);
    margin-bottom: 24px;
  }
  @media (min-width: 640px) {
    .cal-shell { padding: 36px; }
  }
  .cal-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 16px;
  }
  .cal-title-block { min-width: 0; }
  .cal-eyebrow {
    font-size: 11px;
    font-weight: 700;
    color: var(--sea-600);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 4px;
  }
  .cal-month-name {
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -0.02em;
    line-height: 1;
  }
  @media (min-width: 640px) {
    .cal-month-name { font-size: 44px; }
  }
  .cal-year {
    font-size: 14px;
    color: var(--ink-soft);
    font-weight: 500;
    margin-top: 4px;
  }
  .cal-controls { display: flex; gap: 8px; }
  .cal-btn {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: white;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    transition: all 0.2s;
    font-family: inherit;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cal-btn.wide {
    width: auto;
    padding: 0 18px;
    font-size: 13px;
    font-weight: 700;
  }
  .cal-btn:hover {
    background: var(--sea-50);
    color: var(--sea-700);
    border-color: var(--sea-200);
  }

  .cal-greg-info {
    background: linear-gradient(135deg, var(--sea-50), var(--sea-100));
    border-radius: 16px;
    padding: 14px 18px;
    margin-bottom: 20px;
    font-size: 13px;
    color: var(--sea-800);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cal-greg-info-icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--sea-500);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }

var hijriMonths = ['Муҳаррам', 'Сафар', 'Рабиул аввал', 'Рабиул охир', 'Жумодул аввал', 'Жумодул охир', 'Ражаб', 'Шаъбон', 'Рамазон', 'Шаввол', 'Зулқаъда', 'Зулҳижжа'];
var gregorianMonths = ['Январь', 'Феврал', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

var weekDays = ['Якш', 'Душ', 'Сеш', 'Чор', 'Пай', 'Жум', 'Шан'];

function gregorianToHijri(gDate) {
  var jd = Math.floor((gDate.getTime() / 86400000) + 2440587.5);
  var l = jd - 1948440 + 10632;
  var n = Math.floor((l - 1) / 10631);
  var l2 = l - 10631 * n + 354;
  var j = Math.floor((10985 - l2) / 5316) * Math.floor((50 * l2) / 17719)
       + Math.floor(l2 / 5670) * Math.floor((43 * l2) / 15238);
  var l3 = l2 - Math.floor((30 - j) / 15) * Math.floor((17719 * j) / 50)
        - Math.floor(j / 16) * Math.floor((15238 * j) / 43) + 29;
  var month = Math.floor((24 * l3) / 709);
  var day = l3 - Math.floor((709 * month) / 24);
  var year = 30 * n + j - 30;
  return { year: year, month: month, day: day };
}

function hijriToGregorian(hYear, hMonth, hDay) {
  var jd = Math.floor((11 * hYear + 3) / 30) + 354 * hYear + 30 * hMonth
         - Math.floor((hMonth - 1) / 2) + hDay + 1948440 - 385;
  return new Date((jd - 2440587.5) * 86400000);
}

// Ҳижрий ойдаги кунлар сонини ҳисоблаш
function hijriMonthLength(hYear, hMonth) {
  var thisMonth = hijriToGregorian(hYear, hMonth, 1);
  var nextMonth;
  if (hMonth === 12) {
    nextMonth = hijriToGregorian(hYear + 1, 1, 1);
  } else {
    nextMonth = hijriToGregorian(hYear, hMonth + 1, 1);
  }
  return Math.round((nextMonth - thisMonth) / 86400000);
}

function getCurrentHijri() { return gregorianToHijri(new Date()); }

function getDayDate(hMonth, hDay) {
  var current = getCurrentHijri();
  var year = current.year;
  if (hMonth < current.month || (hMonth === current.month && hDay < current.day)) {
    year = current.year + 1;
  }
  return hijriToGregorian(year, hMonth, hDay);
}

function daysUntil(hMonth, hDay) {
  var target = getDayDate(hMonth, hDay);
  var now = new Date();
  now.setHours(0, 0, 0, 0);
  return Math.ceil((target - now) / (1000 * 60 * 60 * 24));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

      html += '<div class="detail-block">';
      html += '<div class="detail-block-label">' + verse.source + '</div>';
      if (verse.arabic) html += '<div class="arabic" style="font-size:26px;text-align:right;line-height:1.9;margin-bottom:16px;color:var(--ink);" dir="rtl">' + verse.arabic + '</div>';
      html += '<div class="detail-text">' + verse.translation + '</div>';
      html += '</div>';
    }
  }

  // Ҳадислар
  html += '<div style="margin: 28px 0 16px;"><div class="section-title" style="font-size:22px;">Шарифа ҳадислар</div></div>';
  if (day.hadiths.length === 0) {
    html += '<div class="placeholder hadiths">';
    html += '<div class="placeholder-icon">ﷺ</div>';
    html += '<div class="placeholder-title">Ҳадислар тез орада қўшилади</div>';
    html += '<div class="placeholder-text">Бу кунга оид саҳиҳ ҳадислар кейинроқ киритилади, инша Аллоҳ.</div>';
    html += '</div>';
  } else {
    for (var h = 0; h < day.hadiths.length; h++) {
      var hadith = day.hadiths[h];
      html += '<div class="detail-block">';
      html += '<div class="detail-block-label">' + hadith.source + '</div>';
      html += '<div class="detail-text" style="margin-bottom:12px;font-style:italic;">«' + hadith.text + '»</div>';
      html += '<div style="font-size:13px;color:var(--ink-light);font-weight:600;">— ' + hadith.narrator + '</div>';
      html += '</div>';
    }
  }

  html += '</div>';

  document.getElementById('view-day').innerHTML = html;
}

// === ҲИЖРИЙ ТАҚВИМ ===
function renderCalendar() {
  var hYear = hijriCalView.year;
  var hMonth = hijriCalView.month;
  var daysInMonth = hijriMonthLength(hYear, hMonth);
  var firstGreg = hijriToGregorian(hYear, hMonth, 1);
  var startWeekDay = firstGreg.getDay();

  var lastGreg = hijriToGregorian(hYear, hMonth, daysInMonth);

  var todayHijri = getCurrentHijri();
  var isCurrentMonth = (todayHijri.year === hYear && todayHijri.month === hMonth);

  // Бу ойдаги муҳим кунларни топиш
  var monthEvents = [];
  for (var e = 0; e < importantDays.length; e++) {
    if (importantDays[e].hMonth === hMonth) {
      monthEvents.push(importantDays[e]);
    }
  }
  monthEvents.sort(function(a, b) { return a.hDay - b.hDay; });

  // Тез текшириш учун хариталар
  var eventMap = {};
  for (var em = 0; em < monthEvents.length; em++) {
    eventMap[monthEvents[em].hDay] = monthEvents[em];
  }

  var html = '<div class="fade-in">';

  // Тақвим шакли
  html += '<div class="cal-shell">';
  html += '<div class="cal-top">';
  html += '<div class="cal-title-block">';
  html += '<div class="cal-eyebrow">Ҳижрий тақвим</div>';
  html += '<div class="cal-month-name">' + hijriMonths[hMonth - 1] + '</div>';
  html += '<div class="cal-year">' + hYear + ' ҳижрий йил</div>';
  html += '</div>';
  html += '<div class="cal-controls">';
  html += '<button class="cal-btn" onclick="calPrev()" aria-label="Олдинги ой">←</button>';
  html += '<button class="cal-btn wide" onclick="calToday()">Бугун</button>';
  html += '<button class="cal-btn" onclick="calNext()" aria-label="Кейинги ой">→</button>';
  html += '</div></div>';

  // Милодий маълумот
  var gregInfo;
  if (firstGreg.getMonth() === lastGreg.getMonth()) {
    gregInfo = firstGreg.getDate() + '–' + lastGreg.getDate() + ' ' + gregorianMonths[firstGreg.getMonth()] + ' ' + firstGreg.getFullYear();
  } else if (firstGreg.getFullYear() === lastGreg.getFullYear()) {
    gregInfo = firstGreg.getDate() + ' ' + gregorianMonthsShort[firstGreg.getMonth()] + ' – ' + lastGreg.getDate() + ' ' + gregorianMonthsShort[lastGreg.getMonth()] + ' ' + lastGreg.getFullYear();
  } else {
    gregInfo = firstGreg.getDate() + ' ' + gregorianMonthsShort[firstGreg.getMonth()] + ' ' + firstGreg.getFullYear() + ' – ' + lastGreg.getDate() + ' ' + gregorianMonthsShort[lastGreg.getMonth()] + ' ' + lastGreg.getFullYear();
  }
  html += '<div class="cal-greg-info"><div class="cal-greg-info-icon">M</div><div>Милодий бўйича: ' + gregInfo + '</div></div>';

  // Ҳафта кунлари
  html += '<div class="cal-weekdays">';
  for (var w = 0; w < 7; w++) {
    html += '<div class="cal-wd' + (w === 5 ? ' friday' : '') + '">' + weekDays[w] + '</div>';
  }
  html += '</div>';

  // Кунлар
  html += '<div class="cal-days">';
  for (var sp = 0; sp < startWeekDay; sp++) {
    html += '<div class="cal-cell empty"></div>';
  }
  for (var dd = 1; dd <= daysInMonth; dd++) {
    var cellGreg = hijriToGregorian(hYear, hMonth, dd);
    var isFriday = cellGreg.getDay() === 5;
    var isToday = isCurrentMonth && dd === todayHijri.day;
    var event = eventMap[dd];

    var cls = 'cal-cell';
    if (isFriday) cls += ' friday';
    if (event) cls += ' important';
    if (isToday) cls += ' today';

    var style = '';
    if (event && !isFriday) {
      style = 'background: linear-gradient(135deg, ' + event.color + ', ' + event.color + 'cc);';
    }

    var onclick = event ? 'onclick="showDay(\'' + event.id + '\')"' : '';

    html += '<button class="' + cls + '" style="' + style + '" ' + onclick + '>';
    html += '<div class="cal-h-day">' + dd + '</div>';
    html += '<div class="cal-g-day">' + cellGreg.getDate() + ' ' + gregorianMonthsShort[cellGreg.getMonth()] + '</div>';
    html += '</button>';
  }
  html += '</div>';

  // Маънолар
  html += '<div class="cal-legend">';
  html += '<div class="legend-item"><div class="legend-swatch today"></div><span>Бугун</span></div>';
  html += '<div class="legend-item"><div class="legend-swatch friday"></div><span>Жума</span></div>';
  html += '<div class="legend-item"><div class="legend-swatch important"></div><span>Муҳим кун</span></div>';
  html += '</div>';

  html += '</div>'; // cal-shell

  // Бу ойдаги муҳим кунлар
  if (monthEvents.length > 0) {
    html += '<div class="month-events">';
    html += '<div class="month-events-title">Бу ойдаги муҳим кунлар</div>';
    for (var me = 0; me < monthEvents.length; me++) {
      var ev = monthEvents[me];
      var evGreg = hijriToGregorian(hYear, hMonth, ev.hDay);
      html += '<div class="event-row" onclick="showDay(\'' + ev.id + '\')">';
      html += '<div class="event-day-num" style="background: linear-gradient(135deg, ' + ev.color + ', ' + ev.color + 'cc);">' + ev.hDay + '</div>';
      html += '<div class="event-info">';
      html += '<div class="event-name">' + ev.name + '</div>';
      html += '<div class="event-meta">' + ev.hDay + ' ' + hijriMonths[hMonth - 1] + ' · ' + evGreg.getDate() + ' ' + gregorianMonthsShort[evGreg.getMonth()] + ' ' + evGreg.getFullYear() + '</div>';
      html += '</div>';
      html += '<div class="event-arrow">→</div>';
      html += '</div>';
    }
    html += '</div>';
  } else {
    html += '<div class="month-events">';
    html += '<div style="text-align:center;padding:32px;color:var(--ink-light);font-size:14px;">Бу ойда муҳим кунлар йўқ</div>';
    html += '</div>';
  }

  html += '</div>';

  document.getElementById('view-calendar').innerHTML = html;
}

// === КЎРИНИШЛАР ===
var prevView = 'home';

function showHome() {
  prevView = 'home';
  document.getElementById('view-home').classList.remove('hidden');
  document.getElementById('view-day').classList.add('hidden');
  document.getElementById('view-calendar').classList.add('hidden');
  document.getElementById('nav-home').classList.add('active');
  document.getElementById('nav-cal').classList.remove('active');
  renderHome();
  window.scrollTo(0, 0);
}

function showDay(dayId) {
  document.getElementById('view-home').classList.add('hidden');
  document.getElementById('view-day').classList.remove('hidden');
  document.getElementById('view-calendar').classList.add('hidden');
  renderDay(dayId);
  window.scrollTo(0, 0);
}

function showCalendar() {
  prevView = 'calendar';
  hijriCalView = getCurrentHijri();
  document.getElementById('view-home').classList.add('hidden');
  document.getElementById('view-day').classList.add('hidden');
  document.getElementById('view-calendar').classList.remove('hidden');
  document.getElementById('nav-home').classList.remove('active');
  document.getElementById('nav-cal').classList.add('active');
  renderCalendar();
  window.scrollTo(0, 0);
}

function goBack() {
  if (prevView === 'calendar') showCalendar();
  else showHome();
}

function calPrev() {
  if (hijriCalView.month === 1) {
    hijriCalView.month = 12;
    hijriCalView.year -= 1;
  } else {
    hijriCalView.month -= 1;
  }
  renderCalendar();
}

function calNext() {
  if (hijriCalView.month === 12) {
    hijriCalView.month = 1;
    hijriCalView.year += 1;
  } else {
    hijriCalView.month += 1;
  }
  renderCalendar();
}

function calToday() {
  hijriCalView = getCurrentHijri();
  renderCalendar();
}

// БОШЛАШ
showHome();
</script>

</html>
