<!DOCTYPE html>
<html lang="uz-Cyrl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Исломий Тақвим</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Manrope:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  // Тема FOUC'ни тўсиш — асосий JS юкланмасдан илгари
  (function () {
    try {
      var t = localStorage.getItem('muhim:theme');
      if (t === 'light' || t === 'dark') {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch (e) {}
  })();
</script>
</head>
<body>

<header>
  <div class="header-inner">
    <button class="brand" onclick="showHome()">
      <div class="brand-mark">☪</div>
      <div class="brand-text">
        <div class="brand-name">Исломий Тақвим</div>
        <div class="brand-tag">Ҳижрий сана ва муҳим кунлар</div>
      </div>
    </button>
    <div class="header-right">
      <nav>
        <button class="nav-btn active" id="nav-home" onclick="showHome()">Кунлар</button>
        <button class="nav-btn" id="nav-cal" onclick="showCalendar()">Тақвим</button>
      </nav>
      <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Тема алмаштириш">
        <span class="icon-moon" aria-hidden="true">☾</span>
        <span class="icon-sun" aria-hidden="true">☀</span>
      </button>
    </div>
  </div>
</header>

<main>
  <div id="view-home"></div>
  <div id="view-day" class="hidden"></div>
  <div id="view-calendar" class="hidden"></div>
</main>

<footer>
  <div class="foot-mark">☪</div>
  <div class="foot-text">Аллоҳу таоло барчамизга яхши кунлар насиб этсин</div>
</footer>

<script src="data.js"></script>
<script src="hijri.js"></script>
<script src="app.js"></script>

</body>
</html>
