<!DOCTYPE html>
<html lang="uz-Cyrl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Исломий Тақвим</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Manrope:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  // Тема FOUC'ни тўсиш — асосий JS юкланмасдан илгари
  (function () {
    try {
      var t = localStorage.getItem('muhim:theme');
      if (t === 'light' || t === 'dark') {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch (e) {}
  })();
</script>
</head>
<body>

<button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Тема алмаштириш">
  <span class="icon-moon" aria-hidden="true">☾</span>
  <span class="icon-sun" aria-hidden="true">☀</span>
</button>

<main>
  <div id="view-home"></div>
  <div id="view-day" class="hidden"></div>
  <div id="view-calendar" class="hidden"></div>
</main>

<nav class="bottom-nav" aria-label="Асосий навигация">
  <button class="bottom-nav-btn active" id="nav-home" onclick="showHome()">
    <span class="bottom-nav-icon" aria-hidden="true">◇</span>
    <span class="bottom-nav-label">Кунлар</span>
  </button>
  <button class="bottom-nav-btn" id="nav-cal" onclick="showCalendar()">
    <span class="bottom-nav-icon" aria-hidden="true">▦</span>
    <span class="bottom-nav-label">Тақвим</span>
  </button>
</nav>

<script src="data.js"></script>
<script src="hijri.js"></script>
<script src="app.js"></script>

</body>
</html>
