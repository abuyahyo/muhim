Name: Muhim
Summary: Glassmorphism uslubidagi namoz vaqtlari vidjetlari va islomiy taqvim
Description: |-
    Uy ekranidagi glassmorphism (shisha) uslubidagi namoz vaqtlari vidjetlari
    va islomiy taqvim PWA'sining Android hamrohi — Muhim.

    6 xil vidjet: namoz vaqtlari paneli (4×2), lenta (4×1), keyingi namoz (2×1),
    sana va namoz (2×2), hijriy sana (2×2), tahajjud oynasi (2×1).

    To'liq oflayn — vaqtlar qurilmada hisoblanadi (PrayTimes.org algoritmi).
    Har bir vidjet uchun alohida shahar (GPS yoki 23 shahar ro'yxati),
    hisoblash usuli (MWL, Misr, Karachi, Ummul Quro, ISNA) va Asr mazhabi
    (Hanafiy/Shofe'iy) tanlanadi. Qoramo'y va Oq mavzular.

    Tillar: o'zbekcha (kirill va lotin), ruscha, inglizcha — ilova ichidan tanlanadi.

    Reklama va kuzatuv yo'q. Ilova to'liq lokal assetlardan ishlaydi.

