Name: Муҳим Виджет
Summary: Glassmorphism uslubidagi namoz vaqtlari vidjetlari
Description: |-
    Uy ekranidagi glassmorphism (shisha) uslubidagi namoz vaqtlari vidjetlari.
    Муҳим islomiy taqvim PWA'sining Android hamrohi.

    6 xil vidjet: намоз вақтлари панели (4×2), лента (4×1), кейинги намоз (2×1),
    сана ва намоз (2×2), ҳижрий сана (2×2), таҳажжуд ойнаси (2×1).

    To'liq oflayn — vaqtlar qurilmada hisoblanadi (PrayTimes.org algoritmi).
    Har bir vidjet uchun alohida shahar (GPS yoki 23 shahar ro'yxati),
    hisoblash usuli (MWL, Миср, Карачи, Уммул Қуро, ISNA) ва Аср мазҳаби
    (Ҳанафий/Шофеъий) tanlanadi. Қорамой ва Оқ mavzular. Reklama va kuzatuv yo'q.

RepoType: git
Repo: https://github.com/abuyahyo/muhim

