<script>
// PWA / Service Worker регистрацияси + янги версия banner.
// SW кейинги версияни топса, фойдаланувчига кичкина banner кўрсатилади.
// Banner босилса skipWaiting() ишга тушади ва саҳифа янгиланади.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('../sw.js').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          // Фақат олдинги SW бор бўлса янги версия деб қойилади (1-юкланиш эмас).
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            showUpdateBanner(nw);
          }
        });
      });
    }).catch(function () {});

    // Янги SW тахт олганда — саҳифани автомат янгилаймиз.
    var refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  });
}

function showUpdateBanner(worker) {
  if (document.querySelector('.update-banner')) return;
  var b = document.createElement('div');
  b.className = 'update-banner';
  var s = document.createElement('span');
  s.textContent = 'Янги версия мавжуд';
  var btn = document.createElement('button');
  btn.textContent = 'Янгилаш';
  btn.addEventListener('click', function () { worker.postMessage('SKIP_WAITING'); });
  b.appendChild(s);
  b.appendChild(btn);
  document.body.appendChild(b);
}
</script>

<script src="../install-banner.js" defer></script>
