plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.abuyahyo.muhim.widget'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.abuyahyo.muhim.widget'
        minSdk 21
        targetSdk 34
        versionCode 10
        versionName '1.9'
    }

    // Ixtiyoriy imzolash: CI'da APK_KEYSTORE_BASE64, APK_KEYSTORE_PASSWORD,
    // APK_KEY_ALIAS, APK_KEY_PASSWORD muhit o'zgaruvchilari berilsa — release
    // APK imzolanadi. Aks holda imzosiz (unsigned) build chiqadi.
    signingConfigs {
        release {
            def ksB64 = System.getenv("APK_KEYSTORE_BASE64")
            if (ksB64) {
                def tmp = File.createTempFile("muhim", ".jks")
                tmp.bytes = java.util.Base64.decoder.decode(ksB64)
                tmp.deleteOnExit()
                storeFile = tmp
                storePassword = System.getenv("APK_KEYSTORE_PASSWORD")
                keyAlias = System.getenv("APK_KEY_ALIAS")
                keyPassword = System.getenv("APK_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("APK_KEYSTORE_BASE64")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            assets.srcDirs += layout.buildDirectory.dir('generated/webAssets')
        }
    }
}

// Web ilovani (PWA) APK assets ichiga bundle qilish — gibrid WebView ilova
// oflayn ishlashi uchun. Repo ildizidan kerakli fayllar nusxalanadi.
def webFiles = [
        'i18n.js', 'content-i18n.js', 'shared.js', 'theme.css', 'nav.css',
        'index.html', 'manifest.json', 'favicon-32.png', 'icon-512.png',
        'apple-touch-icon.png', 'install-banner.js'
]
tasks.register('syncWebAssets', Copy) {
    from(rootDir.parentFile) {
        webFiles.each { f -> it.include f }
        include 'vaqtlar/**'
        include 'kunlar/**'
        include 'joylar/**'
    }
    into layout.buildDirectory.dir('generated/webAssets/web')
}
preBuild.dependsOn 'syncWebAssets'
