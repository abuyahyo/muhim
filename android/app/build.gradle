plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.abuyahyo.muhim.widget'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.abuyahyo.muhim.widget'
        minSdk 21
        targetSdk 34
        versionCode 7
        versionName '1.6'
    }

    // Ixtiyoriy imzolash: CI'da APK_KEYSTORE_BASE64, APK_KEYSTORE_PASSWORD,
    // APK_KEY_ALIAS, APK_KEY_PASSWORD muhit o'zgaruvchilari berilsa — release
    // APK imzolanadi. Aks holda imzosiz (unsigned) build chiqadi.
    signingConfigs {
        release {
            def ksB64 = System.getenv("APK_KEYSTORE_BASE64")
            if (ksB64) {
                def tmp = File.createTempFile("muhim", ".jks")
                tmp.bytes = java.util.Base64.decoder.decode(ksB64)
                tmp.deleteOnExit()
                storeFile = tmp
                storePassword = System.getenv("APK_KEYSTORE_PASSWORD")
                keyAlias = System.getenv("APK_KEY_ALIAS")
                keyPassword = System.getenv("APK_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("APK_KEYSTORE_BASE64")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
