plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.abuyahyo.muhim.widget'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.abuyahyo.muhim.widget'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
